[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "guided-conformational-path"
version = "0.1.0"
description = "Candidate conformational transition graph prototype for protein endpoint structures."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy",
    "scipy",
    "networkx",
    "matplotlib",
]

[project.optional-dependencies]
test = ["pytest"]

[tool.setuptools.packages.find]
include = ["guided_conformational_path*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
