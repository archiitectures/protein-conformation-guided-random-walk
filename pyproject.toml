[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "guided-conformational-path"
version = "0.1.0"
description = "Experimental protein endpoint dataset builder and candidate transition graph prototype."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "biopython",
    "gemmi",
    "numpy",
    "pandas",
    "scipy",
    "networkx",
    "matplotlib",
    "Pillow",
    "PyYAML",
    "requests",
    "tqdm",
]

[project.optional-dependencies]
test = ["pytest"]
notebook = ["ipykernel", "py3Dmol"]

[tool.setuptools.packages.find]
include = ["guided_conformational_path*", "protein_conformer_dataset*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
