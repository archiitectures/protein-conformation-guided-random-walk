[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "parallel-bioemu-tools"
version = "0.1.0"
description = "Isolated parallel BioEmu orchestration helpers for this repository."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "certifi",
    "guided-conformational-path",
    "requests",
    "tornado",
]

[project.optional-dependencies]
dev = ["pytest"]
huggingface = ["huggingface_hub>=0.24"]

[tool.setuptools.package-dir]
"" = "src"

[tool.setuptools.packages.find]
where = ["src"]
include = ["parallel_bioemu_tools*"]

[tool.uv.sources]
guided-conformational-path = { path = "..", editable = true }

[tool.pytest.ini_options]
testpaths = ["tests"]
